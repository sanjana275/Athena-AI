# Local development: Postgres (with pgvector) + API.  Run the frontend with `npm run dev`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatgpt
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/chatgpt
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
