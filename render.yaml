# Render Blueprint for Athena AI Backend API.
services:
  - type: web
    name: athena-ai-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false        # Neon/Supabase PostgreSQL or internal SQLite
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false        # e.g. https://<your-firebase-project>.web.app
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_API_KEY
        sync: false        # Your Groq API Key
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
